name: Bug report
description: Report a reproducible defect in a supported version
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a defect.

        Check the [supported baselines](https://github.com/Yivas/auto-mode-gate/blob/main/docs/compatibility.md) before continuing. Report undisclosed vulnerabilities through [GitHub private vulnerability reporting](https://github.com/Yivas/auto-mode-gate/security/advisories/new), not through this form.

        Remove credentials, tokens, prompts, identifiers, active configuration values, and other private data. Redact private values inside commands, logs, and paths while keeping enough technical detail to reproduce the problem.
  - type: input
    id: version
    attributes:
      label: Auto Mode Gate version
      description: Use the installed package or checkout version.
      placeholder: 0.4.0
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - OpenCode
        - Pi
    validations:
      required: true
  - type: input
    id: host-version
    attributes:
      label: Host version
      description: Report the exact OpenCode or Pi version.
      placeholder: OpenCode 1.18.18 or Pi 0.84.2
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      description: Include the version and architecture when relevant.
      placeholder: Windows 11 x64, macOS 15 arm64, Ubuntu 24.04 x64
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the defect and when it occurs.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sanitized sequence that reproduces the defect.
      placeholder: |
        1. Configure...
        2. Start...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should Auto Mode Gate have done?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What did Auto Mode Gate do instead?
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for this defect.
          required: true
        - label: I checked that these Auto Mode Gate and host versions are supported.
          required: true
        - label: I removed or redacted private and sensitive data from this report.
          required: true
