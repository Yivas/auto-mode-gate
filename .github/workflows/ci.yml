name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.9.0
      - name: Run tests
        run: npm test
      - name: Inspect package contents
        run: npm pack --dry-run

  opencode-host:
    name: OpenCode 1.18.18 host integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v7.0.1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.9.0
      - name: Install validated OpenCode host
        run: npm install --global opencode-ai@1.18.18
      - name: Test packed plugin before the Bash effect
        run: npm run test:opencode-host

  documentation:
    name: documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki
    steps:
      # v7.0.1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.9.0
          cache: npm
          cache-dependency-path: wiki/package-lock.json
      - name: Install documentation dependencies
        run: npm ci
      - name: Build documentation
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
