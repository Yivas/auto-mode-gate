name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # v7.0.1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.9.0
      - name: Install wiki dependencies
        working-directory: wiki
        run: npm ci
      - name: Build wiki
        working-directory: wiki
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Verify documentation artifact
        working-directory: wiki
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/favicon.svg
          test -f dist/sitemap-index.xml
          test -f dist/getting-started/install/index.html
          test -f dist/getting-started/configure/index.html
          test -f dist/getting-started/migrate/index.html
          test -f dist/guide/verify-and-operate/index.html
          test -f dist/guide/pi-controls/index.html
          test -f dist/guide/decisions/index.html
          test -f dist/guide/modes-and-logs/index.html
          test -f dist/guide/coverage-and-boundaries/index.html
          test -f dist/reference/validated-baselines/index.html
          test -f dist/project/participation/index.html
          test -f dist/pagefind/pagefind.js
      # v5.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: wiki/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v5.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
